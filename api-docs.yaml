  /product/search/grouped:
    get:
      tags:
      - Products
      summary: Сгруппированный поиск (мобильное меню)
      description: |
        Один запрос **q** — совпадения по подстроке (как в обычном поиске товаров) возвращаются в двух блоках:
        **categories** — классы товаров (категории каталога); **products** — товары (оборудование).
        Поля **totalCategoryCount** / **totalProductCount** — полное число совпадений; в списках — только первые
        `categoryLimit` / `productLimit` записей (превью). Полный список товаров — через **GET /product** с тем же `q`.
        По умолчанию учитываются только активные товары (`isActive=true`).
      operationId: searchGrouped
      parameters:
      - name: q
        in: query
        description: Текст поиска (обязателен; пустой или только спецсимволы — пустой
          ответ)
        required: true
        schema:
          type: string
      - name: categoryLimit
        in: query
        description: Сколько классов в превью (1–50)
        required: false
        schema:
          type: integer
          format: int32
          default: 5
          maximum: 50
          minimum: 1
      - name: productLimit
        in: query
        description: Сколько товаров в превью (1–50)
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 50
          minimum: 1
      - name: isActive
        in: query
        description: Фильтр активности товара (по умолчанию только активные)
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Категории и товары с количествами
          content:
            application/json: {}
