openapi: 3.1.0
info:
  title: GBCC Website API
  description: |
    REST API интернет-магазина / каталога GBCC: аутентификация (JWT в HttpOnly cookies),
    аккаунты, каталог товаров и файлы, новости, акции (скидки), заказы, обращения в поддержку.

    **Авторизация в Swagger UI:** схема `accessTokenCookie` — cookie `GBCC_ACCESS_TOKEN`
    (после успешного `POST /auth/login` в том же браузере cookie подставляется автоматически;
    при тестах из Postman — передайте cookie вручную).

    **Гостевой токен поддержки:** схема `supportGuestToken` — заголовок `X-Support-Token`
    (значение из `guestAccessToken` после создания обращения без входа).
  version: 0.2.0
servers:
- url: http://localhost:8080
  description: Local Dev Server
tags:
- name: Files
  description: "Загрузка файлов (multipart), поиск метаданных, скачивание и удален\
    ие по UUID-ключу. Файлы хранятся локально (см. app.file.bucket)."
- name: News
  description: "Новости: публичное чтение (с фильтрацией опубликованных для не-мен\
    еджеров). Создание и правки — только ADMIN/OWNER с JWT."
- name: Contact requests
  description: |
    Заявки с формы «Свяжитесь с нами»: публичная отправка; список и назначение — только ADMIN/OWNER (JWT).
    Администратор может взять заявку на изучение (привязка к себе) или снять назначение.
- name: Accounts
  description: "Регистрация клиента (публично), управление аккаунтами с JWT (cookie).\
    \ Правила доступа в сервисном слое."
- name: Orders
  description: "Заказы: оформление клиентом, просмотр, смена статуса (менеджеры)."
- name: News
  description: "Новости: публичное чтение; создание/редактирование — ADMIN/OWNER."
- name: Promotions
  description: |
    Акции (процент скидки, период действия, охват: ALL / PRODUCT / CLASS / SERIES / PRODUCT_TYPE).
    GET — публично; для не-менеджеров отдаются только активные и попадающие в срок. Изменение — JWT ADMIN/OWNER.
- name: Promotions
  description: Акции (скидки по правилам и охвату). Публичный список; изменение —
    ADMIN/OWNER.
- name: Auth
  description: "Вход по email/паролю, обновление сессии, выход. Access/refresh ток\
    ены выставляются в HttpOnly cookies."
- name: Files
  description: Загрузка и выдача файлов по UUID-ключу.
- name: Support
  description: "Обращения в администрацию: гости (токен), клиенты (JWT), ответы ад\
    минов."
- name: Accounts
  description: "Учётные записи: регистрация клиента, CRUD по ролям, поиск, блокиро\
    вка."
- name: Products
  description: "Каталог товаров: создание, поиск, фото, классы."
- name: Orders
  description: |
    Заказы: оформляет только CUSTOMER (JWT). История заказов — GET /order (пагинация), карточка — GET /order/{id}.
    В ответе: displayNumber (короткий номер для UI), подписи статуса и способа оплаты, окно доставки, ссылка на чек.
    Просмотр: клиент — свои заказы; ADMIN/OWNER — любые. Смена статуса — только менеджеры.
    Цены и скидки фиксируются на момент заказа (товар + акции).
- name: Auth
  description: "Вход, обновление и выход. Токены в HttpOnly cookies."
- name: Cooperation requests
  description: |
    Заявки с формы «Сотрудничество с заводом»: публичная отправка; список и назначение — только ADMIN/OWNER (JWT).
    Вложение: UUID файла после загрузки через POST /file (multipart). Тип сотрудничества — произвольная строка (как на фронте).
- name: Support
  description: |
    Обращения в администрацию. Гость: имя + email + первое сообщение; в ответе guestAccessToken — сохранить и передавать в заголовке X-Support-Token.
    Клиент с JWT создаёт обращение без гостевых полей. Все ADMIN/OWNER видят список и переписку.
- name: Products
  description: |
    Каталог: CRUD товара, поиск с фильтрами, сгруппированный поиск /product/search/grouped для мобильного меню,
    привязка фото (файл по UUID). Создание товара сейчас разрешено без JWT (см. SecurityConfig).
paths:
  /promotion/{promotionId}:
    get:
      tags:
      - Promotions
      summary: Получить акцию по id
      description: Публично. Не-менеджеры не получают неактивные или вне окна дат
        (404).
      operationId: getById
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionResponseDto"
        "404":
          description: Нет доступа или не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      tags:
      - Promotions
      summary: Полное обновление акции
      description: JWT. ADMIN/OWNER.
      operationId: update
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromotionRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionResponseDto"
        "400":
          description: Ошибка данных
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    delete:
      tags:
      - Promotions
      summary: Удалить акцию
      description: JWT. ADMIN/OWNER.
      operationId: delete
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Удалена
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    patch:
      tags:
      - Promotions
      summary: Частичное обновление акции
      description: JWT. ADMIN/OWNER.
      operationId: patch
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPromotionRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionResponseDto"
        "400":
          description: Ошибка данных
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /product/{productId}:
    get:
      tags:
      - Products
      summary: Карточка товара
      description: |
        Публично. Полная информация для страницы товара: описание, слоган, теги, тексты вкладок «Доставка»/«Лицензии»,
        счётчик «интересовались», галерея `photoFileIds`, цены, габариты, `isActive` (в наличии / нет).
      operationId: getById_1
      parameters:
      - name: productId
        in: path
        description: UUID товара
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Товар
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "404":
          description: Не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      tags:
      - Products
      summary: Полное обновление товара
      description: PUT — заменяет все обязательные поля согласно DTO.
      operationId: update_1
      parameters:
      - name: productId
        in: path
        description: UUID товара
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Ошибка данных
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Товар не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    patch:
      tags:
      - Products
      summary: Частичное обновление товара
      description: PATCH — только переданные поля.
      operationId: patch_1
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProductRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Ошибка данных
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Товар не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /news/{newsId}:
    get:
      tags:
      - News
      summary: Получить новость по id
      description: Публично. Не-менеджеры видят только опубликованные и с датой публикации
        не в будущем.
      operationId: getById_2
      parameters:
      - name: newsId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NewsResponseDto"
        "404":
          description: Нет доступа или не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      tags:
      - News
      summary: Полное обновление новости
      description: JWT. ADMIN/OWNER.
      operationId: update_2
      parameters:
      - name: newsId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNewsRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NewsResponseDto"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    patch:
      tags:
      - News
      summary: Частичное обновление новости
      description: JWT. ADMIN/OWNER.
      operationId: patch_2
      parameters:
      - name: newsId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNewsRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NewsResponseDto"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Не найдена
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /account/me:
    get:
      tags:
      - Accounts
      summary: Текущий профиль (личный кабинет)
      description: "JWT. Данные аккаунта из токена: имя, фамилия, отчество, контак\
        ты. Пароль в ответе не возвращается."
      operationId: getMyProfile
      responses:
        "200":
          description: Профиль
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponseDto"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Accounts
      summary: Обновить свой профиль
      description: "JWT. Только роль CUSTOMER. Поле password опционально: если не\
        \ передать или пусто — пароль не меняется."
      operationId: updateMyProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerAccountRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponseDto"
        "400":
          description: Не клиент или валидация
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /account/customer/{accountId}:
    put:
      tags:
      - Accounts
      summary: Обновить данные клиента
      description: JWT. Только для роли CUSTOMER по указанному accountId (см. правила
        в сервисе).
      operationId: updateCustomer
      parameters:
      - name: accountId
        in: path
        description: UUID аккаунта
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerAccountRequestDto"
        required: true
      responses:
        "200":
          description: Обновлено
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponseDto"
        "400":
          description: Неверная роль или данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Аккаунт не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Конфликт уникальности
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    delete:
      tags:
      - Accounts
      summary: Удалить клиента
      description: JWT. Удаление записи CUSTOMER.
      operationId: deleteCustomer
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Удалено
        "400":
          description: Не клиент
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /support/conversations:
    get:
      tags:
      - Support
      summary: Список обращений (администраторы)
      description: "Требует JWT. В сервисе допускаются только ADMIN и OWNER. Фильт\
        ры: status, query (тема или email гостя)."
      operationId: searchForAdmin
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
      - name: query
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Страница
          content:
            application/json: {}
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Не менеджер
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    post:
      tags:
      - Support
      summary: Создать обращение
      description: |
        Без JWT: обязательны message, guestName, guestEmail (валидный email).
        С JWT и ролью CUSTOMER: только message (и опционально subject); гостевой токен не выдаётся.
        Администраторам создавать диалог через этот метод нельзя — отвечают в существующем.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportConversationRequestDto"
        required: true
      responses:
        "201":
          description: Создано; для гостя в теле guestAccessToken
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateSupportConversationResponseDto"
        "400":
          description: Некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Попытка создать от имени администратора
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /support/conversations/{conversationId}/messages:
    post:
      tags:
      - Support
      summary: Добавить сообщение
      description: |
        Приоритет: если валиден X-Support-Token для этого диалога — сообщение от гостя (даже при наличии JWT).
        Иначе: ADMIN/OWNER — ответ администратора; CUSTOMER — только владелец диалога.
        Закрытый диалог — ошибка 400.
      operationId: addMessage
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Support-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSupportMessageRequestDto"
        required: true
      responses:
        "200":
          description: Обновлённый диалог
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupportConversationDetailResponseDto"
        "400":
          description: Диалог закрыт или неверные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Диалог не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /promotion:
    get:
      tags:
      - Promotions
      summary: Поиск акций
      description: "Публично. Фильтры: name, isActive, scope. Для гостей — только\
        \ видимые акции."
      operationId: search
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - PRODUCT
          - CLASS
          - SERIES
          - PRODUCT_TYPE
      responses:
        "200":
          description: Страница акций
          content:
            application/json: {}
    post:
      tags:
      - Promotions
      summary: Создать акцию
      description: JWT. Только ADMIN/OWNER.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromotionRequestDto"
        required: true
      responses:
        "201":
          description: Создана
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionResponseDto"
        "400":
          description: Некорректные scope/даты
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Нет JWT
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Нет прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /product:
    get:
      tags:
      - Products
      summary: Поиск товаров (каталог)
      description: |
        Страница каталога: фильтры комбинируются по **И**.
        - **q** — подстрока в бренде, описании, названиях класса / серии / типа.
        - **classId** — UUID категории (из GET /product/classes); альтернатива префиксу **className**.
        - **seriesIds** / **typeIds** — повторяющиеся параметры (`?typeIds=u1&typeIds=u2`) для чекбоксов «серия / тип»;
          если заданы, префиксные **seriesName** / **typeName** не используются для этой оси.
        - **minPrice** / **maxPrice**, **minHeightMm** / **maxHeightMm** — диапазоны (высота — габарит «Размеры» в UI).
        - **isActive** — для витрины обычно `true` (в наличии / активные карточки).
        Пагинация: `page`, `size`. Сортировка `sort`: например `sort=popularityScore,desc` (популярность),
        `sort=price,asc`, `sort=createdAt,desc` (новизна), `sort=isActive,desc` (наличие), `sort=brand,asc`.
      operationId: search_1
      parameters:
      - name: q
        in: query
        description: "Текстовый запрос: бренд, описание, названия класса/серии/тип\
          а"
        required: false
        schema:
          type: string
      - name: className
        in: query
        description: Префикс имени класса (категории)
        required: false
        schema:
          type: string
      - name: classId
        in: query
        description: Точная категория по UUID (предпочтительно для боковой колонки)
        required: false
        schema:
          type: string
          format: uuid
      - name: seriesIds
        in: query
        description: "Фильтр по сериям: повторять параметр для нескольких UUID"
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: typeIds
        in: query
        description: Фильтр по типам товара (чекбоксы размеров/модификаций)
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: seriesName
        in: query
        required: false
        schema:
          type: string
      - name: typeName
        in: query
        required: false
        schema:
          type: string
      - name: brand
        in: query
        required: false
        schema:
          type: string
      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0.0
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0.0
      - name: minHeightMm
        in: query
        description: "Мин. высота (мм), габарит для фильтра «Размеры»"
        required: false
        schema:
          type: integer
          format: int32
      - name: maxHeightMm
        in: query
        description: Макс. высота (мм)
        required: false
        schema:
          type: integer
          format: int32
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Страница товаров
          content:
            application/json: {}
    post:
      tags:
      - Products
      summary: Создать товар
      description: "Создаёт товар с классом/серией/типом (по имени или существующи\
        м id), ценой, скидкой и габаритами."
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequestDto"
        required: true
      responses:
        "201":
          description: Создан
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Валидация или бизнес-правила
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Конфликт уникальности товара
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
