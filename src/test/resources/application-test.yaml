# Профиль test: JWT и owner для интеграционных тестов. JDBC/Flyway — PostgreSQL из Testcontainers
# (см. PostgresIntegrationTestConfiguration + @ServiceConnection в Spring Boot 4).

spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  account:
    owner:
      email: integration-owner@example.com
      password: OwnerIntegrationTest123!

logging:
  level:
    backend.website.gbcc: INFO
    org.flywaydb: INFO
