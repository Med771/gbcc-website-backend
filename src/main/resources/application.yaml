spring:
  application:
    name: "gbcc-website-backend"

  datasource:
    url: jdbc:postgresql://localhost:5510/gbcc
    username: GBCC
    password: GBCC!05510
    name: gbcc
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

app:
  jwt:
    secret: c9f4c0a9d9e4f6b1a3c7e5f9b2d8a6c1e4f7a9c3d6b8e1f2a5c7d9e3b6f1a8c4
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    cookie-secure: false
    cookie-same-site: Lax
  account:
    owner:
      email: gbcc@gmail.com
      password: GBCC!05510
  file:
    bucket: storage

  referral:
    link-base-url: "http://localhost:3000/ref"
    commission-percent-new-client: 7
    commission-percent-returning-client: 2
    min-withdrawal-amount: 1000

  analytics:
    enabled: true
    cookie-name: GBCC_VISITOR_ID
    cookie-ttl-days: 400
    cookie-same-site: Lax
    cookie-enabled: true
    max-batch-size: 50
    max-path-length: 1024
    max-referrer-length: 1024
    max-user-agent-length: 512
    max-metadata-chars: 4000
    top-paths-limit: 15
    max-event-age-days: 7
    max-future-skew-minutes: 5
    honor-dnt: true

  swagger:
    title: "GBCC Website API"
    description: |
      REST API интернет-магазина / каталога GBCC: аутентификация (JWT в HttpOnly cookies),
      аккаунты, каталог товаров и файлы, новости, акции (скидки), заказы, обращения в поддержку.

      **Авторизация в Swagger UI:** схема `accessTokenCookie` — cookie `GBCC_ACCESS_TOKEN`
      (после успешного `POST /auth/login` в том же браузере cookie подставляется автоматически;
      при тестах из Postman — передайте cookie вручную).

      **Гостевой токен поддержки:** схема `supportGuestToken` — заголовок `X-Support-Token`
      (значение из `guestAccessToken` после создания обращения без входа).
    version: "0.2.0"

    servers:
      - url: "http://localhost:8080"
        description: "Local Dev Server"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    backend.website.gbcc: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN