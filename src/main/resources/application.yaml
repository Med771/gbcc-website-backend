spring:
  application:
    name: "gbcc-website-backend"

  datasource:
    url: jdbc:postgresql://localhost:5432/gbcc
    username: username
    password: password
    name: gbcc
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true